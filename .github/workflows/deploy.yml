name: Deploy backend

# Deploys backend/ to Railway after CI passes on main, or on demand.
# Requires repo secret RAILWAY_TOKEN (a Railway *project* token for project
# "sama4", environment "production"). Without it the job is skipped with a notice.
# The frontend deploys separately via Vercel.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN secret not set; skipping deploy. Run 'make deploy-backend' locally instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy to Railway
        if: steps.token.outputs.skip != 'true'
        working-directory: backend
        # --no-gitignore: Railway's uploader otherwise drops backend/app/models/
        run: npx --yes @railway/cli@5.71.0 up --no-gitignore --service sama4-api --ci
